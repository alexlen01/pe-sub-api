spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pesub}
    username: ${SPRING_DATASOURCE_USERNAME:pesub}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: caffeine
    cache-names: bb-templates
    caffeine:
      spec: maximumSize=200,expireAfterWrite=25m
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:3001}

pe-sub-extraction:
  base-url: ${PE_SUB_EXTRACTION_URL:http://localhost:3002}

logging:
  file:
    path: ${LOG_PATH:C:/Users/alexl/apps/pe-sub/logs}
