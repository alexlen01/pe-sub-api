spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pesub}
    username: ${SPRING_DATASOURCE_USERNAME:pesub}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:3001}

logging:
  level:
    com.ubs.pesubapi: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: C:/Users/alexl/apps/pe-sub/logs/pe-sub-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      file-name-pattern: C:/Users/alexl/apps/pe-sub/logs/pe-sub-api.%d{yyyy-MM-dd}.%i.log
